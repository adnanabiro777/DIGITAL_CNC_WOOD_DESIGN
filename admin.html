<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d352a"><title>অ্যাডমিন প্যানেল | DIGITAL CNC WOOD DESIGN HOUSE</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f3ed;color:#20342b;font-family:system-ui,'Noto Sans Bengali',sans-serif}.top{background:#0d352a;color:#f6e5a3;padding:20px;text-align:center;border-bottom:4px solid #e4c56a}.wrap{max-width:720px;margin:20px auto;padding:0 14px}.card{background:#fff;border:1px solid #e7dec6;border-radius:14px;padding:18px;margin:14px 0}h2{font-size:20px;color:#0d352a;margin-top:0}label{display:block;margin:12px 0 6px;font-weight:700}input,textarea{width:100%;padding:12px;border:1px solid #b9c8bf;border-radius:8px;font:inherit}button,.btn{border:0;background:#0d352a;color:white;padding:12px 16px;border-radius:9px;font:inherit;font-weight:700;cursor:pointer;display:inline-block;text-decoration:none;margin:6px 4px 4px 0}.warn{background:#fff5d8;padding:12px;border-radius:8px;font-size:14px}.status{white-space:pre-wrap;color:#0d352a}.item{display:flex;gap:12px;align-items:center;margin:12px 0}.item img{width:88px;height:75px;object-fit:cover;border-radius:8px}.danger{background:#a52828}small{color:#63746b}</style></head><body><header class="top"><h1>DIGITAL CNC WOOD DESIGN HOUSE</h1><p>অ্যাডমিন প্যানেল</p></header><main class="wrap"><div class="warn">প্রথমে Supabase URL ও anon key এই ফাইলের কোডে বসাতে হবে। নিজের লগইন তথ্য কাউকে দেবেন না।</div><section class="card" id="loginbox"><h2>নিরাপদ অ্যাডমিন লগইন</h2><label>ইমেইল</label><input id="email" type="email" autocomplete="username" placeholder="আপনার অ্যাডমিন ইমেইল"><label>পাসওয়ার্ড</label><input id="password" type="password" autocomplete="current-password" placeholder="আপনার পাসওয়ার্ড"><button id="login">লগইন করুন</button><button id="logout" hidden>লগআউট</button><p class="status" id="status"></p></section><section class="card" id="editor" hidden><h2>ব্যবসার তথ্য পরিবর্তন</h2><label>প্রোঃ নাম</label><input id="owner"><label>প্রথম ফোন নম্বর</label><input id="phone1"><label>দ্বিতীয় ফোন নম্বর</label><input id="phone2"><label>ঠিকানা</label><textarea id="address" rows="3"></textarea><button id="save">তথ্য সংরক্ষণ করুন</button></section><section class="card" id="gallerybox" hidden><h2>“আমাদের কাজ” ছবির গ্যালারি</h2><label>নতুন ছবি বাছুন</label><input id="photo" type="file" accept="image/*"><button id="upload">ছবি আপলোড করুন</button><div id="items"></div></section><p><a class="btn" href="index.html">মূল ওয়েবসাইট দেখুন</a></p></main><script type="module">
import {createClient} from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';
// Supabase Dashboard > Project Settings > API থেকে এই দুটি মান বসান। কখনো service_role/secret key ব্যবহার করবেন না。
const SUPABASE_URL='YOUR_SUPABASE_PROJECT_URL';
const SUPABASE_ANON_KEY='YOUR_SUPABASE_ANON_KEY';
const $=id=>document.getElementById(id), say=t=>$('status').textContent=t;
if(SUPABASE_URL.startsWith('YOUR_')){say('সেটআপ বাকি: Supabase URL এবং anon key বসান।');$('login').disabled=true;}else{
const db=createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
async function refresh(){const {data:{user}}=await db.auth.getUser();$('logout').hidden=!user;$('login').hidden=!!user;$('editor').hidden=!user;$('gallerybox').hidden=!user;if(!user)return;const {data:admin}=await db.from('admin_users').select('user_id').eq('user_id',user.id).maybeSingle();if(!admin){say('এই অ্যাকাউন্ট অ্যাডমিন হিসেবে অনুমোদিত নয়।');$('editor').hidden=true;$('gallerybox').hidden=true;return;}say('লগইন সফল।');const {data:s,error}=await db.from('site_settings').select('*').eq('id',1).single();if(error){say('সাইটের তথ্য লোড হয়নি: '+error.message);return;}['owner','phone1','phone2','address'].forEach(k=>$(k).value=s[k]||'');await loadGallery();}
async function loadGallery(){const {data,error}=await db.from('gallery').select('*').order('created_at',{ascending:false});if(error){say('গ্যালারি লোড হয়নি: '+error.message);return;}$('items').innerHTML='';(data||[]).forEach(x=>{const row=document.createElement('div');row.className='item';const img=document.createElement('img');img.src=x.image_url;const b=document.createElement('button');b.className='danger';b.textContent='মুছুন';b.onclick=async()=>{if(!confirm('এই ছবি মুছবেন?'))return;const path=x.image_url.split('/cnc-gallery/')[1];if(path)await db.storage.from('cnc-gallery').remove([decodeURIComponent(path)]);const r=await db.from('gallery').delete().eq('id',x.id);if(r.error)say(r.error.message);else{say('ছবি মুছে ফেলা হয়েছে।');loadGallery();}};row.append(img,document.createTextNode(x.caption||'আমাদের কাজ'),b);$('items').append(row);});}
$('login').onclick=async()=>{const {error}=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error)say('লগইন হয়নি: '+error.message);else await refresh();};$('logout').onclick=async()=>{await db.auth.signOut();say('লগআউট হয়েছে।');refresh();};$('save').onclick=async()=>{const {data:{user}}=await db.auth.getUser();const r=await db.from('site_settings').update({owner_name:$('owner').value,phone1:$('phone1').value,phone2:$('phone2').value,address:$('address').value,updated_at:new Date().toISOString()}).eq('id',1);say(r.error?'সংরক্ষণ হয়নি: '+r.error.message:'তথ্য সংরক্ষিত হয়েছে।');};$('upload').onclick=async()=>{const f=$('photo').files[0];if(!f){say('আগে একটি ছবি বেছে নিন।');return;}if(f.size>8*1024*1024){say('ছবির সাইজ ৮ MB-এর কম রাখুন।');return;}const path=Date.now()+'-'+f.name.replace(/[^a-zA-Z0-9._-]/g,'_');const up=await db.storage.from('cnc-gallery').upload(path,f,{upsert:false});if(up.error){say('আপলোড হয়নি: '+up.error.message);return;}const {data:{publicUrl}}=db.storage.from('cnc-gallery').getPublicUrl(path);const ins=await db.from('gallery').insert({image_url:publicUrl,caption:'আমাদের কাজ'});if(ins.error){say('ছবি সংরক্ষণ হয়নি: '+ins.error.message);return;}say('ছবি আপলোড হয়েছে।');$('photo').value='';loadGallery();};refresh();}
</script></body></html>
